name: FTPS Deploy to Joxicraft (Fallback)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Temporary workaround: ftp.joxicraft.co.za is the only reachable FTP endpoint,
  # but its FTPS certificate is issued to *.aserv.co.za/aserv.co.za (not the connect
  # hostname). Certificate validity is still verified; only hostname-checking is
  # disabled. Revert once the host cert matches or a correct endpoint is available.
  FTP_SERVER: ftp.joxicraft.co.za
  FTP_PORT: 21
  # Dedicated FTP account is rooted at the site directory, so '.' is the site root.
  FTP_SERVER_DIR: "."

jobs:
  deploy:
    name: Deploy via explicit FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stamp release version metadata
        id: version_stamp
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_BASE: 1.0.0
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError
          import re

          repo = os.getenv("GITHUB_REPOSITORY", "")
          token = os.getenv("GITHUB_TOKEN", "")
          branch = os.getenv("GITHUB_REF_NAME", "")
          sha = os.getenv("GITHUB_SHA", "")
          run_number = int(os.getenv("GITHUB_RUN_NUMBER", "0") or "0")
          run_id = os.getenv("GITHUB_RUN_ID", "")
          workflow = os.getenv("GITHUB_WORKFLOW", "")
          version_base = os.getenv("VERSION_BASE", "1.0.0")
          environment = "production"

          def parse_semver(value: str):
              match = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", (value or "").strip())
              if not match:
                  return None
              return [int(match.group(1)), int(match.group(2)), int(match.group(3))]

          base = parse_semver(version_base) or [1, 0, 0]
          latest = base[:]
          release_tag = ""
          release_label = ""
          is_breaking = False

          if repo and token:
              req = Request(
                  f"https://api.github.com/repos/{repo}/releases/latest",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "gwn-portal-deploy",
                  },
              )
              try:
                  with urlopen(req, timeout=8) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                      release_tag = str(payload.get("tag_name") or "").strip()
                      text_blob = " ".join([
                          str(payload.get("name") or ""),
                          str(payload.get("body") or ""),
                          release_tag,
                      ]).upper()
                      if "BREAKING" in text_blob:
                          is_breaking = True
                          release_label = "BREAKING"
                      parsed_release = parse_semver(release_tag)
                      if parsed_release:
                          latest = parsed_release
              except (HTTPError, URLError, TimeoutError, ValueError):
                  pass

          major, minor, _patch = latest
          if is_breaking:
              major += 1
              minor = 0
          elif branch in ("main", "master") or branch.startswith("release/"):
              minor += 1

          patch = run_number if run_number > 0 else int(datetime.now(timezone.utc).timestamp())
          semantic_version = f"{major}.{minor}.{patch}"

          metadata = {
              "semantic_version": semantic_version,
              "major_version": major,
              "minor_version": minor,
              "patch_version": patch,
              "git_sha": sha,
              "short_sha": sha[:7],
              "branch_name": branch,
              "release_tag": release_tag,
              "release_label": release_label,
              "is_breaking": 1 if is_breaking else 0,
              "deployment_environment": environment,
              "deployed_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
              "workflow_name": workflow,
              "workflow_run_id": run_id,
              "workflow_run_number": str(run_number),
              "source": "deploy_stamp",
          }

          with open("version.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
              handle.write("\n")

          print(f"Stamped version.json => {semantic_version}")
          PY

      - name: Ensure fallback version metadata
        if: always()
        run: |
          if [ "${{ steps.version_stamp.outcome }}" != "success" ]; then
            echo "::warning::Version stamping failed. Deploy will continue with fallback metadata."
          fi
          if [ ! -s version.json ]; then
            cat > version.json <<EOF
          {
            "semantic_version": "1.0.0",
            "major_version": 1,
            "minor_version": 0,
            "patch_version": ${GITHUB_RUN_NUMBER:-0},
            "git_sha": "${GITHUB_SHA}",
            "short_sha": "${GITHUB_SHA::7}",
            "branch_name": "${GITHUB_REF_NAME}",
            "release_tag": "",
            "release_label": "",
            "is_breaking": 0,
            "deployment_environment": "production",
            "deployed_at_utc": "$(date -u '+%Y-%m-%d %H:%M:%S')",
            "workflow_name": "${GITHUB_WORKFLOW}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_number": "${GITHUB_RUN_NUMBER}",
            "source": "fallback"
          }
          EOF
          fi

      - name: Write .env from secret
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "ERROR: PRODUCTION_ENV_FILE secret is missing or empty. Aborting deploy." >&2
            exit 1
          fi
          printf '%s' "$PRODUCTION_ENV_FILE" > .env

      - name: Remove legacy env.production to avoid ambiguity
        run: rm -f env.production

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp rsync

      - name: Stage deploy files
        run: |
          STAGE_DIR="${GITHUB_WORKSPACE}/_ftp_staging"
          mkdir -p "$STAGE_DIR"
          rsync -a --delete \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='.copilot/' \
            --exclude='uploads/' \
            --exclude='public/uploads/' \
            --exclude='.well-known/' \
            --exclude='.ftpquota' \
            --exclude='_ftp_staging/' \
            ./ "$STAGE_DIR/"
          echo "DEPLOY_STAGE=$STAGE_DIR" >> "$GITHUB_ENV"

      - name: Deploy via lftp with retry
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "ERROR: FTP credentials are missing." >&2
            exit 1
          fi

          # Escape backslashes, double-quotes, dollar-signs, and backticks so
          # credentials are safe inside lftp double-quoted string literals.
          _FTP_USER=$(printf '%s' "$FTP_USERNAME" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\$/\\$/g; s/`/\\`/g')
          _FTP_PASS=$(printf '%s' "$FTP_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\$/\\$/g; s/`/\\`/g')

          LFTP_SCRIPT=$(mktemp -p "$RUNNER_TEMP" lftp_deploy_XXXXXX)
          chmod 600 "$LFTP_SCRIPT"
          trap 'rm -f "${LFTP_SCRIPT:-}"' EXIT
          # Heredoc expansion fills in server/path values; credentials are
          # interpolated via the pre-escaped variables above.
          cat > "$LFTP_SCRIPT" <<LFTP_EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode on
          set ftp:sync-mode on
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set net:timeout 120
          set net:max-retries 2
          set net:reconnect-interval-base 10
          set net:reconnect-interval-max 20
          set mirror:parallel-transfer-count 1
          open ftp://$FTP_SERVER:$FTP_PORT
          user "$_FTP_USER" "$_FTP_PASS"
          mirror --reverse --delete --only-newer --verbose \\
            -x '(^|/)\\.git($|/)' \\
            -x '(^|/)\\.github($|/)' \\
            -x '(^|/)\\.vscode($|/)' \\
            -x '(^|/)\\.copilot($|/)' \\
            -x '(^|/)uploads($|/)' \\
            -x '(^|/)public/uploads($|/)' \\
            -x '(^|/)\\.well-known($|/)' \\
            -x '(^|/)\\.ftpquota$' \\
            "$DEPLOY_STAGE/" "$FTP_SERVER_DIR"
          bye
          LFTP_EOF

          deploy() {
            lftp -f "$LFTP_SCRIPT"
          }

          for attempt in 1 2 3; do
            echo "--- Deploy attempt $attempt of 3 ---"
            if deploy; then
              echo "Deploy succeeded on attempt $attempt."
              rm -f "$LFTP_SCRIPT"
              exit 0
            fi

            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done

          rm -f "$LFTP_SCRIPT"
          echo "ERROR: All 3 deploy attempts failed." >&2
          exit 1
