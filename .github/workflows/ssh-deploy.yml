name: SSH Deploy to Joxicraft (Primary)

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: 102.222.124.13
  DEPLOY_PORT: 24
  DEPLOY_TARGET_DIR: /home/joxicaxs/student.joxicraft.co.za

permissions:
  contents: write

jobs:
  deploy:
    # Disabled: production deploy is FTP-only. The main-branch guard is kept
    # alongside it so re-enabling cannot allow a non-main dispatch to deploy.
    if: false && github.ref == 'refs/heads/main'
    name: Deploy via SSH/tar+scp
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Not continue-on-error: a failed baseline lookup must abort the deploy
      # rather than silently republish a downgraded version as "latest".
      - name: Stamp release version metadata
        id: version_stamp
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_BASE: 1.0.0
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError
          import re

          repo = os.getenv("GITHUB_REPOSITORY", "")
          token = os.getenv("GITHUB_TOKEN", "")
          branch = os.getenv("GITHUB_REF_NAME", "")
          sha = os.getenv("GITHUB_SHA", "")
          run_number = int(os.getenv("GITHUB_RUN_NUMBER", "0") or "0")
          run_id = os.getenv("GITHUB_RUN_ID", "")
          workflow = os.getenv("GITHUB_WORKFLOW", "")
          version_base = os.getenv("VERSION_BASE", "1.0.0")
          environment = "production"

          def parse_semver(value: str):
              match = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", (value or "").strip())
              if not match:
                  return None
              return [int(match.group(1)), int(match.group(2)), int(match.group(3))]

          base = parse_semver(version_base) or [1, 0, 0]
          latest = base[:]
          release_tag = ""
          release_label = ""
          is_breaking = False

          if not (repo and token):
              print(
                  "::error::GITHUB_REPOSITORY/GITHUB_TOKEN unavailable; cannot "
                  "determine the release baseline. Refusing to stamp a version.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          req = Request(
              f"https://api.github.com/repos/{repo}/releases/latest",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "gwn-portal-deploy",
              },
          )
          try:
              with urlopen(req, timeout=8) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  release_tag = str(payload.get("tag_name") or "").strip()
                  text_blob = " ".join([
                      str(payload.get("name") or ""),
                      str(payload.get("body") or ""),
                      release_tag,
                  ]).upper()
                  if "BREAKING" in text_blob:
                      is_breaking = True
                      release_label = "BREAKING"
                  parsed_release = parse_semver(release_tag)
                  if parsed_release:
                      latest = parsed_release
                  elif release_tag:
                      print(
                          "::error::Latest release tag "
                          f"'{release_tag}' is not semver; refusing to guess a baseline.",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)
          except HTTPError as exc:
              # 404 is the only benign case: the repo genuinely has no
              # releases yet, so VERSION_BASE is the correct baseline.
              if exc.code != 404:
                  print(
                      f"::error::Release baseline lookup failed (HTTP {exc.code}). "
                      "Refusing to stamp a version that could downgrade the "
                      "published release.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
              print("No existing release found (HTTP 404); using VERSION_BASE.")
          except (URLError, TimeoutError, ValueError) as exc:
              print(
                  f"::error::Release baseline lookup failed ({type(exc).__name__}: {exc}). "
                  "Refusing to stamp a version that could downgrade the "
                  "published release.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          major, minor, _patch = latest
          if is_breaking:
              major += 1
              minor = 0
          elif branch in ("main", "master") or branch.startswith("release/"):
              minor += 1

          patch = run_number if run_number > 0 else int(datetime.now(timezone.utc).timestamp())
          semantic_version = f"{major}.{minor}.{patch}"

          metadata = {
              "semantic_version": semantic_version,
              "major_version": major,
              "minor_version": minor,
              "patch_version": patch,
              "git_sha": sha,
              "short_sha": sha[:7],
              "branch_name": branch,
              "release_tag": release_tag,
              "release_label": release_label,
              "is_breaking": 1 if is_breaking else 0,
              "deployment_environment": environment,
              "deployed_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
              "workflow_name": workflow,
              "workflow_run_id": run_id,
              "workflow_run_number": str(run_number),
              "source": "deploy_stamp",
          }

          with open("version.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
              handle.write("\n")

          output_path = os.getenv("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"semantic_version={semantic_version}\n")

          print(f"Stamped version.json => {semantic_version}")
          PY

      # Stamping is now mandatory; a literal 1.0.0 fallback would downgrade the
      # published release, so verify instead of fabricating a version.
      - name: Verify version metadata
        run: |
          if [ ! -s version.json ]; then
            echo "ERROR: version.json was not produced by the stamp step. Aborting deploy." >&2
            exit 1
          fi
          cat version.json

      - name: Write .env from secret
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "ERROR: PRODUCTION_ENV_FILE secret is missing or empty. Aborting deploy." >&2
            exit 1
          fi
          printf '%s' "$PRODUCTION_ENV_FILE" > .env

      - name: Remove legacy env.production to avoid ambiguity
        run: rm -f env.production

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          KNOWN_HOST_ENTRY=$(ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" 2>/dev/null)
          if [ -z "$KNOWN_HOST_ENTRY" ]; then
            echo "ERROR: ssh-keyscan returned no host key for $DEPLOY_HOST:$DEPLOY_PORT. Aborting." >&2
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOST_ENTRY" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # rsync is not installed on the shared host; tar+scp transfers the same
      # file set without requiring rsync on the remote side.
      - name: Create deploy archive
        run: |
          tar -czf "$RUNNER_TEMP/deploy.tar.gz" \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.copilot' \
            --exclude='uploads' \
            --exclude='public/uploads' \
            --exclude='.well-known' \
            --exclude='.ftpquota' \
            .

      - name: Upload archive to remote
        run: |
          scp -i ~/.ssh/id_deploy \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/deploy.tar.gz" \
            "${{ secrets.SSH_USERNAME }}@$DEPLOY_HOST:gwn_deploy_${{ github.run_id }}.tar.gz"

      - name: Extract archive on remote
        run: |
          ARCHIVE_NAME="gwn_deploy_${{ github.run_id }}.tar.gz"
          # Pass runner-side values as positional args so the remote script needs
          # no variable expansion of runner env vars (single-quoted heredoc).
          ssh -i ~/.ssh/id_deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USERNAME }}@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_TARGET_DIR" "$ARCHIVE_NAME" << 'REMOTE'
          set -e
          DEPLOY_DIR="$1"
          ARCHIVE_NAME="$2"
          # Ensure the target directory tree exists before any find/rm operations.
          mkdir -p "$DEPLOY_DIR" "$DEPLOY_DIR/public" "$DEPLOY_DIR/uploads" "$DEPLOY_DIR/public/uploads"
          # Remove stale deployed files to mirror rsync --delete semantics.
          # Protected top-level paths are left untouched.
          find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 \
            ! -name uploads ! -name .well-known ! -name .ftpquota ! -name public \
            -exec rm -rf {} +
          # Remove stale files under public/, preserving public/uploads.
          if [ -d "$DEPLOY_DIR/public" ]; then
            find "$DEPLOY_DIR/public" -mindepth 1 -maxdepth 1 ! -name uploads -exec rm -rf {} +
          fi
          tar -xzf "$HOME/$ARCHIVE_NAME" -C "$DEPLOY_DIR"
          rm -f "$HOME/$ARCHIVE_NAME"
          REMOTE

      - name: Clean up local archive
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.tar.gz"

      # Establishes the cumulative version baseline: the next run reads this
      # release via /releases/latest and bumps from it instead of VERSION_BASE.
      # The job is main-only, so any successful deploy here is production.
      - name: Publish release tag for deployed version
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          VERSION=$(python3 -c "import json;print(json.load(open('version.json')).get('semantic_version',''))" 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            echo "::warning::No semantic_version in version.json; skipping release creation."
            exit 0
          fi
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          # Never publish a release that would move "latest" backwards, e.g. if
          # the baseline lookup produced a lower version than what is published.
          CURRENT=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo "")
          if [ -n "$CURRENT" ]; then
            if ! python3 - "$CURRENT" "$VERSION" <<'PY'
          import re, sys

          def parse(value):
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", (value or "").strip())
              return tuple(int(g) for g in m.groups()) if m else None

          current, candidate = parse(sys.argv[1]), parse(sys.argv[2])
          if current is None:
              sys.exit(0)
          sys.exit(0 if candidate is not None and candidate > current else 1)
          PY
            then
              echo "::warning::Computed version $VERSION is not greater than published $CURRENT; skipping release creation."
              exit 0
            fi
          fi

          if ! gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$TAG" \
                --latest \
                --notes "Automated production deploy ${TAG} from ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})."; then
            echo "::warning::Could not create release $TAG; deploy already succeeded."
          fi
